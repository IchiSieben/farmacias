  cadena: boticasperu
  sku: "00907"
  decision: match
  motivo: "Panadol Niños 160mg/5ml jarabe 60 ml; Panadol Niños figura con 3 R.S. (EE-09339, E-14820, EE-07826): renumerado"
  revisado: "2026-09-25, propuesto en la sesión F3 y aprobado por iC7"

