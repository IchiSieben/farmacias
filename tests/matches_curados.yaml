# Capa 4 del matcher (V2_PLAN §3.4): pares decididos a mano. Manda sobre todo lo
# anterior (llaves, reglas, R.S., imagen). Se acumula sesión a sesión.
#
#   ref       fila de la referencia: <objectID InRetail>:<pack|fraccion>
#   cadena    boticasperu | universal
#   sku       id del producto en esa cadena (evidencia.sku en data.json)
#   decision  match (casa aunque el matcher lo vete) | veto (nunca casa)
#   motivo    por qué, en una línea; sale en la evidencia
#   revisado  fecha (YYYY-MM-DD) y quién
#
# Criterio para curar un "match": misma marca, mismo laboratorio, misma
# concentración, forma y cantidad, precio alineado; el R.S. que muestra una cadena
# está viejo o renumerado. No se curan genéricos de otro laboratorio: esos son
# "equivalentes", no el mismo producto (docs/MATCHING.md).

